<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<main class="main-container">
    <header class="company-header">
        <div class="company-logo">
            <img src="../resources/random-logo.png"
                 alt="Logo de la empresa">
        </div>

        <div class="company-name">
            <h1>Nombre de la empresa</h1>
        </div>
    </header>

    <section class="call-to-action-form">
        <h2>Formulario llamada a la acción</h2>
    </section>

    <section class="products-examples">
        <h2>Ejemplos de productos</h2>
        <div class="card-container">
            <button class="product-card"></button>
            <button class="product-card"></button>
            <button class="product-card"></button>
            <button class="product-card"></button>
        </div>
    </section>


    <section class="testimonials">
        <h2>Testimonios, clientes relevantes</h2>
        <div class="card-container">
            <button class="client-card"></button>
            <button class="client-card"></button>
            <button class="client-card"></button>
            <button class="client-card"></button>
        </div>
    </section>

    <section class="warranties">
        <h2>Garantías</h2>
    </section>

    <footer class="contact">
        <h2>Contacto</h2>
    </footer>
</main>
</body>
</html>
