<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<main class="main-container">
    <header class="company-header">
        <div>
            <img src="../resources/random-logo.png"
                 alt="Logo de la empresa">
        </div>

        <div>
            <h1>Nombre de la empresa</h1>
            <p>Beneficios del producto</p>
            <button class="call-to-action-button">Llamada a la acción</button>
        </div>
    </header>

    <section class="products-examples">
        <h2>Ejemplos de productos</h2>
    </section>

    <section class="call-to-action-form">
        <h2>Formulario llamada a la acción</h2>
        <form class="form-buttons-container">
            <button class="form-button"></button>
            <button class="form-button"></button>
            <button class="form-button"></button>
            <button class="form-button"></button>
        </form>
    </section>

    <section class="warranties">
        <h2>Garantías</h2>
    </section>

    <section class="testimonials">
        <h2>Testimonios, clientes relevantes</h2>
    </section>

    <footer class="contact">
        <h2>Contacto</h2>
    </footer>
</main>
</body>
</html>
